      height: 100vh;

      max-width: 680px;
      height: 110px;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      padding: 16px;
      box-sizing: border-box;
      font-size: 14px;
      color: #374151;

          category: 'Strategy',
          text: 'Critique this concept: [IDEA]. Evaluate target audience, defensibility, and competitive moats.',
          tags: ['strategy']
        }
      ],
      settings: {
        activeTheme: 'ferrariCorse',
        sidebarOpen: true,
        themeEnabled: true,
        promptsEnabled: true
      },
      uiPalette: null
    };

    const storageListeners = [];

    window.chrome = {
      runtime: {
        id: 'mock-extension-id',
        lastError: null,
        openOptionsPage: () => window.open('../options/options.html', '_blank')
      },
      storage: {
        local: {
          get: (keys, cb) => {
            const res = {};
            if (Array.isArray(keys)) {
              keys.forEach(k => res[k] = mockStorage[k]);
            } else if (typeof keys === 'string') {
              res[keys] = mockStorage[keys];
            } else {
              Object.assign(res, mockStorage);
            }
            if (cb) cb(res);
            return Promise.resolve(res);
          },
          set: (obj, cb) => {
            const changes = {};
            for (const k in obj) {
              changes[k] = { oldValue: mockStorage[k], newValue: obj[k] };
              mockStorage[k] = obj[k];
            }
            storageListeners.forEach(fn => fn(changes));
            if (cb) cb();
            return Promise.resolve();
          }
        },
        onChanged: {
          addListener: (fn) => storageListeners.push(fn)
        }
      }
    };
