<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptCanvas</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div id="app">
    <!-- Header -->
    <header id="popup-header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5Z" />
            <path d="m2 17 10 5 10-5" />
            <path d="m2 12 10 5 10-5" />
          </svg>
        </div>
        <div class="logo-info">
          <span class="logo-name">PromptCanvas</span>
        </div>
      </div>
      <div class="platform-indicator">
        <svg class="icon-svg icon-xs platform-dot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        <span id="platform-name">Detecting</span>
      </div>
    </header>

    <!-- Status Banner -->
    <div id="status-banner">
      <div class="status-content">
        <div class="status-pulse-wrap">
          <span class="status-pulse-dot"></span>
        </div>
        <div class="status-text-wrap">
          <span class="status-sub">ENGINE STATUS</span>
          <span id="status-text">Connected</span>
        </div>
      </div>
      <button id="btn-toggle-sidebar" class="action-btn-sm">
        <span>SIDEBAR</span>
        <svg class="icon-svg icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M15 3v18" />
          <path d="m8 9 3 3-3 3" />
        </svg>
      </button>
    </div>

    <!-- Quick Stats -->
    <div id="quick-stats">
      <div class="stat-card">
        <div class="stat-value" id="stat-theme">—</div>
        <div class="stat-label">
          <svg class="icon-svg icon-tiny" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
          </svg>
          <span>THEME</span>
        </div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <div class="stat-value" id="stat-prompts">0</div>
        <div class="stat-label">
          <svg class="icon-svg icon-tiny" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" />
          </svg>
          <span>PROMPTS</span>
        </div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <div class="stat-value">4</div>
        <div class="stat-label">
          <svg class="icon-svg icon-tiny" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="7" x="3" y="3" rx="1" />
            <rect width="7" height="7" x="14" y="3" rx="1" />
            <rect width="7" height="7" x="14" y="14" rx="1" />
            <rect width="7" height="7" x="3" y="14" rx="1" />
          </svg>
          <span>AI TOOLS</span>
        </div>
      </div>
    </div>

    <!-- Palette Selector Section -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">Palette Selector</span>
        <span class="section-sub">TOKYO DUO</span>
      </div>
      <div class="theme-chips" id="theme-chips"></div>
    </section>

    <!-- Navigation Section -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">Quick Controls</span>
      </div>
      <div class="actions-grid">
        <button class="action-card" id="btn-open-prompts">
          <div class="action-icon-wrap">
            <svg class="icon-svg icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 16 4-4-4-4" />
              <path d="m6 8-4 4 4 4" />
              <path d="m14.5 4-5 16" />
            </svg>
          </div>
          <span class="action-label">Prompts</span>
        </button>
        <button class="action-card" id="btn-open-themes">
          <div class="action-icon-wrap">
            <svg class="icon-svg icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
              <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
              <path
                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
            </svg>
          </div>
          <span class="action-label">Themes</span>
        </button>
        <button class="action-card" id="btn-open-settings">
          <div class="action-icon-wrap">
            <svg class="icon-svg icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </div>
          <span class="action-label">Settings</span>
        </button>
        <button class="action-card" id="btn-open-options">
          <div class="action-icon-wrap">
            <svg class="icon-svg icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              <polyline points="15 3 21 3 21 9" />
              <line x1="10" x2="21" y1="14" y2="3" />
            </svg>
          </div>
          <span class="action-label">Options</span>
        </button>
      </div>
    </section>

    <!-- Master Theming Toggle -->
    <section class="section">
      <div class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-title-wrap">
            <span class="toggle-title">Page Theming</span>
          </div>
          <span class="toggle-desc">Apply Tokyo theme to active AI workspace</span>
        </div>
        <label class="big-toggle">
          <input type="checkbox" id="master-theme-toggle" checked>
          <span class="big-toggle-slider"></span>
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer id="popup-footer">
      <span class="footer-text">Tokyo Duo Engine</span>
      <div class="footer-links">
        <a href="#" id="link-options">
          <span>Options Dashboard</span>
          <svg class="icon-svg icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </a>
      </div>
    </footer>
  </div>
  <script src="../common/utils/color.js"></script>
  <script src="../common/utils/dom.js"></script>
  <script src="../common/constants/themes.js"></script>
  <script src="popup.js"></script>
</body>

</html>
